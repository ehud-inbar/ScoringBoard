<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#fbf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הנקודות שלנו">
<title>הנקודות שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light only;
  --bg:#fbf7f2;--surface:#ffffff;--surface-2:#f3ece4;--ink:#211c17;--muted:#81766c;--line:#ebe2d7;
  --plus:#17905f;--plus-soft:#e2f4eb;--minus:#d2443b;--minus-soft:#fbe6e3;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}

header{padding:8px 0 18px}
header h1{margin:0;font-size:28px;font-weight:800}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}

.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:26px}
.kid{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 8px 14px;text-align:center;position:relative;overflow:hidden;
  border:2px solid transparent;transition:border-color .15s,transform .1s}
.kid::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.kid:active{transform:scale(.98)}
.kid.on{border-color:var(--c)}
.avatar{width:52px;height:52px;border-radius:17px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-weight:800;font-size:24px;margin:4px auto 8px}
.name{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.score{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.score.neg{color:var(--minus)}
.stats{color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px}

.feed-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.feed-head h2{margin:0;font-size:19px}
.feed-head button{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.day{font-size:13px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.list li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.d{min-width:46px;text-align:center;font-weight:800;border-radius:11px;padding:6px 0;font-size:16px;flex:none}
.d.p{background:var(--plus-soft);color:var(--plus)}
.d.m{background:var(--minus-soft);color:var(--minus)}
.txt{flex:1;min-width:0}
.r{font-weight:500;overflow-wrap:anywhere}
.t{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.t i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.empty,.msg{color:var(--muted);text-align:center;padding:26px 20px;font-size:15px;background:var(--surface);border-radius:18px;line-height:1.5}
.msg.err{color:var(--minus)}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>הנקודות שלנו</h1>
    <p id="today"></p>
  </header>
  <section class="kids" id="kids"><div class="msg" style="grid-column:1/-1">טוען…</div></section>
  <section id="feed"></section>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  'use strict';
  var DAY = 86400000;
  var COLORS = ['#e2557f','#2f7de1','#8a5cf0','#e8892b','#16a39a','#c2410c','#4f46e5','#0f766e'];
  var data = null, filter = null, showAll = false;

  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function signed(n){ return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n); }
  function plain(n){ return n < 0 ? '−' + Math.abs(n) : String(n); }
  function soft(hex, a){ var n = parseInt(hex.slice(1),16); return 'rgba(' + (n>>16) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }
  var fmtToday = new Intl.DateTimeFormat('he-IL', {weekday:'long', day:'numeric', month:'long'});
  var fmtDay   = new Intl.DateTimeFormat('he-IL', {weekday:'long', day:'numeric', month:'numeric'});
  var fmtTime  = new Intl.DateTimeFormat('he-IL', {hour:'2-digit', minute:'2-digit'});
  var fmtClock = new Intl.DateTimeFormat('he-IL', {hour:'2-digit', minute:'2-digit'});

  function startOfDay(t){ var d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
  function kidById(id){ for (var i=0;i<data.kids.length;i++) if (data.kids[i].id === id) return data.kids[i]; return null; }
  function sumSince(id, t){ return data.events.reduce(function(s,e){ return e.kidId === id && e.ts >= t ? s + e.delta : s; }, 0); }
  function dayLabel(t){
    var d = startOfDay(t), today = startOfDay(Date.now());
    if (d === today) return 'היום';
    if (d === today - DAY) return 'אתמול';
    return fmtDay.format(t);
  }

  function render(){
    $('#today').textContent = fmtToday.format(new Date());
    if (!data) return;
    if (!data.kids.length) {
      $('#kids').innerHTML = '<div class="msg" style="grid-column:1/-1">עדיין אין כאן ילדים.</div>';
      $('#feed').innerHTML = '';
      return;
    }
    data.kids.forEach(function(k, i){ if (!/^#[0-9a-f]{6}$/i.test(k.color || '')) k.color = COLORS[i % COLORS.length]; });
    if (filter && !kidById(filter)) filter = null;

    var today = startOfDay(Date.now()), week = Date.now() - 7*DAY;
    $('#kids').innerHTML = data.kids.map(function(k){
      return '<button class="kid' + (filter === k.id ? ' on' : '') + '" data-kid="' + esc(k.id) + '" style="--c:' + k.color + ';--cs:' + soft(k.color,.14) + '" aria-pressed="' + (filter === k.id) + '">' +
        '<div class="avatar">' + esc(k.name.charAt(0)) + '</div>' +
        '<div class="name">' + esc(k.name) + '</div>' +
        '<div class="score' + (k.total < 0 ? ' neg' : '') + '" dir="ltr">' + plain(k.total) + '</div>' +
        '<div class="stats"><span>היום <bdi dir="ltr">' + signed(sumSince(k.id, today)) + '</bdi></span><span>השבוע <bdi dir="ltr">' + signed(sumSince(k.id, week)) + '</bdi></span></div>' +
      '</button>';
    }).join('');

    var list = data.events.filter(function(e){ return !filter || e.kidId === filter; });
    var shown = showAll ? list : list.slice(0, 30);
    var fk = filter && kidById(filter);
    var html = '<div class="feed-head"><h2>' + (fk ? 'מה קרה ל' + esc(fk.name) : 'מה קרה לאחרונה') + '</h2>' +
      (fk ? '<button data-all>כולם</button>' : '') + '</div>';

    if (!shown.length) {
      html += '<div class="empty">עדיין אין אירועים</div>';
    } else {
      var lastDay = null, open = false;
      shown.forEach(function(e){
        var dl = dayLabel(e.ts);
        if (dl !== lastDay) {
          if (open) html += '</ul>';
          html += '<div class="day">' + esc(dl) + '</div><ul class="list">';
          lastDay = dl; open = true;
        }
        var k = kidById(e.kidId) || {name:'', color:'#999999'};
        html += '<li style="--c:' + k.color + '"><span class="d ' + (e.delta > 0 ? 'p' : 'm') + '" dir="ltr">' + signed(e.delta) + '</span>' +
          '<div class="txt"><div class="r">' + esc(e.reason || '') + '</div>' +
          '<div class="t">' + (fk ? '' : '<i></i>' + esc(k.name) + ' · ') + fmtTime.format(e.ts) + '</div></div></li>';
      });
      if (open) html += '</ul>';
      if (list.length > shown.length) html += '<button class="foot" data-more style="display:block;margin:16px auto 0;text-decoration:underline">להציג עוד</button>';
    }
    $('#feed').innerHTML = html;
    $('#foot').textContent = 'עודכן ב-' + fmtClock.format(new Date());
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.kid) { filter = filter === b.dataset.kid ? null : b.dataset.kid; showAll = false; render(); }
    else if (b.hasAttribute('data-all')) { filter = null; showAll = false; render(); }
    else if (b.hasAttribute('data-more')) { showAll = true; render(); }
  });

  // כתובת ה-exec של פרויקט ה-Apps Script של הילדים
  var API_URL = 'https://script.google.com/macros/s/AKfycbzYUA9SvhE8B-30NWg2F7J-Fc726SX-_Db78EcmHgICMMJfqk6_d8lAkD3HM0m8GJ7C9w/exec';

  // המפתח מגיע בקישור אחרי # (לא נשלח לשרת של GitHub) ונשמר בטלפון
  var STORE = 'kids-board';
  function getStored(k){ try { return localStorage.getItem(STORE + ':' + k); } catch(e){ return null; } }
  function setStored(k, v){ try { if (v == null) localStorage.removeItem(STORE + ':' + k); else localStorage.setItem(STORE + ':' + k, v); } catch(e){} }
  var m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash);
  var KEY = m ? m[1] : getStored('key');
  if (m) setStored('key', KEY);

  // מציג מיד את הנתונים האחרונים ששמורים בטלפון, עד שמגיעים חדשים
  try { var cached = JSON.parse(getStored('data') || 'null'); if (cached && cached.kids) data = cached; } catch(e){}

  function showError(text){
    if (!data) $('#kids').innerHTML = '<div class="msg err" style="grid-column:1/-1">' + text + '</div>';
    else $('#foot').textContent = text;
  }

  var loading = false;
  function load(){
    if (loading) return;
    if (!KEY) { showError('חסר מפתח בקישור. בקשו מאבא או מאמא את הקישור המלא.'); return; }
    loading = true;
    fetch(API_URL + '?k=' + encodeURIComponent(KEY), {cache:'no-store', credentials:'omit'})
      .then(function(r){ return r.json(); })
      .then(function(res){
        loading = false;
        if (res && res.ok) {
          data = res.data;
          setStored('data', JSON.stringify(data));
          render();
        } else if (res && res.error === 'bad_key') {
          data = null; setStored('data', null); setStored('key', null);
          $('#feed').innerHTML = '';
          showError('הקישור לא תקין. בקשו מאבא או מאמא קישור חדש.');
        } else {
          showError('לא הצלחתי לטעון את הנקודות. נסו לרענן בעוד רגע.');
        }
      })
      .catch(function(){
        loading = false;
        showError(data ? 'אין חיבור כרגע · מוצג המידע האחרון' : 'לא הצלחתי לטעון את הנקודות. נסו לרענן בעוד רגע.');
      });
  }

  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
  setInterval(function(){ if (!document.hidden) load(); }, 60000);
  render();
  load();
})();
</script>
</body>
</html>
